<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnCue</title>
<style>
:root {
  --map: #eef1f4; --panel: #ffffff; --ink: #141a23; --muted: #6b7686; --line: #e4e7ec; --soft: #f4f6f8;
  --accent: #2563eb; --ego: #2563eb; --target: #ea580c; --good: #15803d; --warn: #b45309; --danger: #dc2626;
  --shadow: 0 10px 30px rgba(15, 23, 42, .10), 0 1px 3px rgba(15, 23, 42, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --map: #0b0f14; --panel: #151a21; --ink: #e6eaf0; --muted: #8b95a5; --line: #262e39; --soft: #1b212a;
    --accent: #60a5fa; --ego: #60a5fa; --target: #fb923c; --good: #4ade80; --warn: #fbbf24; --danger: #f87171;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --map: #0b0f14; --panel: #151a21; --ink: #e6eaf0; --muted: #8b95a5; --line: #262e39; --soft: #1b212a;
  --accent: #60a5fa; --ego: #60a5fa; --target: #fb923c; --good: #4ade80; --warn: #fbbf24; --danger: #f87171;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--map); color: var(--ink);
  font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 980px; margin: 0 auto; padding: 56px 16px 48px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--ego), var(--target)); box-shadow: var(--shadow); }
h1 { font-size: 34px; letter-spacing: -.02em; margin: 0; }
.title { color: var(--muted); font-size: 14px; margin: 14px 0 6px; }
.lead { margin: 0 0 30px; max-width: 720px; font-size: 16.5px; }
.claims { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 0 0 30px; }
.claim { background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.claim b { display: block; font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.claim span { color: var(--muted); font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
a.card { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px;
  color: inherit; text-decoration: none; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; }
a.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
a.card h2 { font-size: 18px; margin: 2px 0 0; letter-spacing: -.01em; }
a.card p { margin: 0; color: var(--muted); font-size: 14px; }
a.card .go { margin-top: auto; padding-top: 8px; color: var(--accent); font-weight: 600; font-size: 13.5px; }
.tag { font-size: 11.5px; color: var(--target); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
footer { margin-top: 34px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo"></span><h1>OnCue</h1></div>
  <p class="title"><i>OnCue: Generating Occlusion Hazards with Controlled Reveal Timing in Real Driving Logs</i></p>
  <p class="lead" data-en="Driving logs contain occlusion, but almost never occlusion that forces a planner to act before the hazard is visible. OnCue constructs such tests in real logged scenes by fixing when the hidden road user is revealed and when it would meet the ego, and labels each sample a reaction or an anticipation test."
     data-zh="驾驶日志里有遮挡，却几乎没有迫使规划器在危险可见之前就行动的遮挡。OnCue 在真实日志场景中规定被遮挡者何时显露、何时与自车相遇，构造这样的测试，并把每个样本标为反应测试或预判测试。"></p>
  <!--claims-->
  <div class="grid">
    <a class="card" href="explained/index.html"><div class="tag" data-en="Start here" data-zh="从这里开始"></div>
      <h2 data-en="The method explained" data-zh="方法讲解"></h2>
      <p data-en="Concepts, the reasoning behind each step, what each experiment must show, and where reviewers may push, in plain words." data-zh="用大白话讲清概念、每一步的道理、每个实验要证明什么，以及审稿人可能挑的地方。"></p>
      <span class="go" data-en="Read →" data-zh="阅读 →"></span></a>
    <a class="card" href="cases/index.html"><div class="tag" data-en="The method" data-zh="方法"></div>
      <h2 data-en="OnCue tests" data-zh="OnCue 测试"></h2>
      <p data-en="Pedestrians inserted behind real parked cars and queues, replayed in closed loop: the same planner masked and see-through, and an occlusion-aware planner." data-zh="在真实停放车辆和车队后插入的行人，闭环回放：同一规划器的屏蔽版与透视版，以及遮挡感知规划器。"></p>
      <span class="go" data-en="Open →" data-zh="打开 →"></span></a>
  </div>
  <footer><button id="lang">中文</button><button id="theme">◐</button>
    <span data-en="Offline pages; nothing is fetched from the network." data-zh="离线页面，不访问网络。"></span><!--source--></footer>
</main>
<script>
let lang = (() => { let l = null; try { l = localStorage.getItem("oncue.lang"); } catch (e) {} return l || "en"; })();
function apply() {
  document.querySelectorAll("[data-en]").forEach(e => e.textContent = e.dataset[lang]);
  document.getElementById("lang").textContent = lang === "en" ? "中文" : "English";
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
}
document.getElementById("lang").onclick = () => { lang = lang === "en" ? "zh" : "en"; try { localStorage.setItem("oncue.lang", lang); } catch (e) {} apply(); };
document.getElementById("theme").onclick = () => { const r = document.documentElement, d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); r.dataset.theme = d ? "light" : "dark"; };
apply();
</script>
</body>
</html>
