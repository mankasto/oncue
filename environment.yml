# The Python environment OnCue runs in, managed by conda.
#   conda env create -f environment.yml     then   conda activate oncue
# Python and every package pinned, matching a GPU machine's base environment:
# Python 3.10.19 and, for each package that environment has, its version (torch 2.8.0,
# torchvision 0.23.0, scipy 1.13.1, protobuf 6.33.5, matplotlib 3.10.8, pillow 12.1.1, Cython
# 3.2.4, einops 0.8.2, hf-xet 1.6.0, safetensors, regex), but numpy 2.2.6 and shapely 2.1.2, the
# newest for Python 3.10 (its numpy 1.26.4 is ten times slower in float32 scalar arithmetic, its
# shapely 2.0.7, with GEOS 3.11, makes generation 2.6 times slower); the others
# at versions that install with these on Python 3.10. On that server the environment is a conda
# clone of the base environment plus these pins (tools/setup_env.sh CLONE_FROM=...), so its CUDA
# torch stays; elsewhere torch and torchvision are the CPU wheels (macOS: PyPI's own).
# torch, tensorflow, torchvision, matplotlib and bezier are for the model and the planners;
# tensorboard (with Markdown, Werkzeug and tensorboard-data-server; Markdown
# 3.10.3 is the newest for Python 3.10) for the training's TensorBoard log. The last line (-e .)
# installs OnCue itself.
# MetaDrive (an ordinary pinned package, its source never edited) reads its assets only from its
# own package folder; after creating the environment run
#   python -m metadrive.pull_asset      (the 0.4.3 assets, about 170 MB)
name: oncue
channels:
  - conda-forge
dependencies:
  - python=3.10.19
  - pip
